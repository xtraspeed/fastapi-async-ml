version: '3.8'

services:
  # -------------------------------------------------------------
  # Message Broker: RabbitMQ
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ml_rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml_network

  # -------------------------------------------------------------
  # Result Backend & Idempotency Cache: Redis
  # -------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: ml_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ml_network

  # -------------------------------------------------------------
  # Web Gateway: FastAPI
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_fastapi_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - ml_network

  # -------------------------------------------------------------
  # Distributed ML Worker: Celery
  # -------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_celery_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2 -Q ml_inference_queue,ml_batch_queue
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - ml_network

  # -------------------------------------------------------------
  # Worker Observability Dashboard: Flower
  # -------------------------------------------------------------
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml_flower_dashboard
    command: celery -A app.core.celery_app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge
